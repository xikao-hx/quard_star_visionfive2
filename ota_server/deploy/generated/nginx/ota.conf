server {
    listen 443 ssl http2;
    server_name ota.example.com;

    ssl_certificate /etc/nginx/certs/ota.crt;
    ssl_certificate_key /etc/nginx/certs/ota.key;

    access_log /home/xikao/quard_star_tutorial/ota_server/logs/nginx-access.log;
    error_log /home/xikao/quard_star_tutorial/ota_server/logs/nginx-error.log;

    client_max_body_size 2g;

    location /packages/ {
        alias /home/xikao/quard_star_tutorial/ota_server/packages/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
